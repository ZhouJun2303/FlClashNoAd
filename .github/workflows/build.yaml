name: noad-android

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.4'
  GO_VERSION: '1.26.4'
  ANDROID_API: '36'
  ANDROID_BUILD_TOOLS: '36.0.0'
  ANDROID_NDK_VERSION: '28.2.13676358'

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Dart sources
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate localizations
        run: dart run intl_utils:generate

      - name: Check generated sources
        run: |
          git diff --exit-code -- \
            lib/models/generated \
            lib/providers/generated \
            lib/database/generated \
            lib/l10n

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test --reporter expanded

      - name: Run Go tests
        working-directory: core
        run: go test .

  build_android:
    name: Build Android APKs
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Configure Android signing and Firebase
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SERVICE_JSON: ${{ secrets.SERVICE_JSON }}
        run: |
          test -n "$KEYSTORE"
          test -n "$KEY_ALIAS"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$SERVICE_JSON"
          echo "$KEYSTORE" | base64 --decode > android/app/keystore.jks
          echo "$SERVICE_JSON" | base64 --decode > android/app/google-services.json
          {
            echo "keyAlias=$KEY_ALIAS"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
          } >> android/local.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android release
        run: dart setup.dart android --env stable -v

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: noad-android-apks
          path: dist/*.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build_android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - name: Checkout source with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: noad-android-apks
          path: dist

      - name: Prepare release assets
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          tar \
            --exclude='.git' \
            --exclude='.dart_tool' \
            --exclude='.gradle' \
            --exclude='build' \
            --exclude='dist' \
            -czf "dist/NoAd-${version}-source.tar.gz" .
          (cd dist && sha256sum ./* > SHA256SUMS)
          sed \
            -e "s|VERSION|${version}|g" \
            -e "s|REPOSITORY|${GITHUB_REPOSITORY}|g" \
            .github/release_template.md > release.md

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release.md